<!DOCTYPE html>
<html lang="Pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        #cadastro{
            max-width: 450px;
            width: 100%;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            gap: 5px;
        }
        #cadastro img{
            width: 45%;
        }

        #cadastro form{
            width: 90%;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        body{
            display: flex;
            align-items: center;
            height: 100vh;
            background-color: rgb(227, 227, 227);
        }

        #btn{
            background-color: rgb(95, 20, 165);
            color: white;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div id="cadastro" class="container-fluid shadow">
            <img src="https://getbootstrap.com.br/docs/4.1/assets/img/bootstrap-stack.png" alt="">
            <h1>Cadastro Bootstrap</h1>
            <form action="#" class="form d-flex flex-direction-column">

                <input type="text" name="Nome" id="nome" class="form-control" placeholder="Nome:">
                <input type="email" name="email" id="email" class="form-control" placeholder="E-mail:">
                <input type="tel" name="telefone" id="telefone" class="form-control" placeholder="Telefone:">
            
                <button id="btn" type="submit" class="btn">Cadastrar</button>
            </form>
        </div>
    </div>
</body>
</html>
